name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: "24.20.0"
          cache: true

      - name: Cache Emscripten SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/emsdk-6.0.8
          key: emsdk-ubuntu-24.04-x64-6.0.8-e5bd3d0874e302a18f13c5b41f5bacf9a40c8e59

      - name: Install native toolchains
        env:
          EMSDK_DIR: ${{ runner.temp }}/emsdk-6.0.8
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ca-certificates curl git make xxd xz-utils
          if [[ ! -d "$EMSDK_DIR/.git" ]]; then
            git clone --filter=blob:none --depth 1 --branch 6.0.8 https://github.com/emscripten-core/emsdk.git "$EMSDK_DIR"
          fi
          test "$(git -C "$EMSDK_DIR" rev-parse HEAD)" = "e5bd3d0874e302a18f13c5b41f5bacf9a40c8e59"
          "$EMSDK_DIR/emsdk" install 6.0.8
          "$EMSDK_DIR/emsdk" activate 6.0.8

          archive="$RUNNER_TEMP/rgbds-linux-x86_64.tar.xz"
          directory="$RUNNER_TEMP/rgbds-1.0.3"
          curl --fail --location --retry 3 --output "$archive" https://github.com/gbdev/rgbds/releases/download/v1.0.3/rgbds-linux-x86_64.tar.xz
          printf '%s  %s\n' '280a52061a0c516999bee75ac357628d6d50784309e0486cef25f7460e6f330b' "$archive" | sha256sum --check -
          mkdir "$directory"
          tar --extract --xz --file "$archive" --directory "$directory"
          (cd "$directory" && sudo ./install.sh)

      - name: Build and verify SameBoy Wasm
        env:
          EMSDK_DIR: ${{ runner.temp }}/emsdk-6.0.8
        run: |
          node_bin="$(dirname "$(command -v node)")"
          source "$EMSDK_DIR/emsdk_env.sh" >/dev/null
          export PATH="$node_bin:$PATH"
          test "$(node --version)" = "v24.20.0"
          emcc --version | grep -F "6.0.8"
          test "$(rgbasm -V)" = "rgbasm v1.0.3"
          vp run wasm:build
          sha256sum --check wasm/sameboy.wasm.sha256
          vp run smoke

      - name: Stage Wasm artifact
        run: |
          mkdir artifact
          cp src/emulator/sameboy.wasm artifact/
          cp wasm/sameboy.wasm.sha256 artifact/sameboy.wasm.sha256
          {
            node --version
            rgbasm -V
            git -C vendor/SameBoy rev-parse HEAD
            sha256sum src/emulator/sameboy.wasm
          } > artifact/build-info.txt

      - name: Upload Wasm artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sameboy-wasm-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: "24.20.0"
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Download Wasm artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sameboy-wasm-${{ github.sha }}
          path: ${{ runner.temp }}/sameboy

      - name: Install verified Wasm
        run: |
          cp "$RUNNER_TEMP/sameboy/sameboy.wasm" src/emulator/sameboy.wasm
          sha256sum --check wasm/sameboy.wasm.sha256

      - run: vp run check
      - run: vp test run
      - run: vp build
      - run: npx wrangler deploy --dry-run

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wasm, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Wasm artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sameboy-wasm-${{ github.sha }}
          path: artifact
      - name: Publish release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" artifact/sameboy.wasm artifact/sameboy.wasm.sha256 artifact/build-info.txt --clobber
